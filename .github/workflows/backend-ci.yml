name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - transaction-service
          - payment-service
          - fraud-detection-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # transaction-service's TransactionSagaIntegrationTest spins up real
      # MySQL and Kafka containers via Testcontainers - GitHub's ubuntu
      # runners ship Docker already, so this just works with no extra setup.
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          retention-days: 7
