spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8085
# Used to look up a phone number by account number before sending the OTP SMS.
account:
  service:
    url: http://account-service:8081
# Twilio - all optional. If any of these are blank, OTPs are only logged
# (the previous behavior), never sent as a real SMS. See the root README
# for exactly where to get these values and where to set them.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
notification:
  sms:
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:+91}
management:
  endpoints:
    web:
      exposure:
        include: health, info
