spring:
  application:
    name: transaction-service
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:mysql://host.docker.internal:3307/transaction_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8082
account:
  service:
    url: http://account-service:8081
# Must be the exact same value as account-service's app.jwt.secret - this
# service only verifies tokens, it never issues them, so it has to trust
# signatures made with the same key account-service signed them with.
app:
  jwt:
    secret: ${APP_JWT_SECRET:demo-only-jwt-signing-secret-change-me-before-any-real-deployment-1234567890}
management:
  endpoints:
    web:
      exposure:
        include: health, info
